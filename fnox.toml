# Committed by design: this file holds ciphertext only. The identity that
# decrypts it is not in the repo.
#
# Run secret-bearing tasks with `fnox exec -- mise run <task>`. mise's [env]
# block in this repo holds non-secret values only.
#
# There is one secret in this repo and it is deliberately NOT set here:
#   * VAULT_MEMORY_API_KEY -- daemon/auth.py enables authentication only when
#     this variable is present. A value committed here (even ciphertext, once
#     someone runs `fnox exec`) would switch a daemon configured without it into
#     requiring a key, so this file declares where the secret belongs instead of
#     choosing that behaviour for you. Add it with:
#
#         fnox set -p age VAULT_MEMORY_API_KEY
#
#     and start the daemon under the same `fnox exec` so both sides agree.

