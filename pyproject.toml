[project]
name = "vault-memory"
version = "0.8.0"
description = "Semantic memory layer for Obsidian vaults"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "starlette>=0.27.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "weaviate-client>=4.0.0",
    "sentence-transformers>=2.0.0",
    "validators>=0.20.0",
    "watchdog>=3.0.0",
    "python-frontmatter>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli", "daemon"]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "integration: tests that require live PostgreSQL and Weaviate services (auto-skip without services; run with -m integration)",
]
